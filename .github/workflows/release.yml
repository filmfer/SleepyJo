name: Release

on:
  push:
    tags: ['v*']

env:
  # Bump the Python version here (single source of truth).
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # NOTE: ARM runners (ubuntu-*-arm, windows-11-arm) are unavailable
        # for private repositories — only these hosted targets are used.
        include:
          - os: macos-14          # Apple Silicon (M Series)
            arch: arm64
          - os: macos-15-intel    # Intel
            arch: x86_64
          - os: ubuntu-22.04      # Debian/Ubuntu/Fedora compatible
            arch: x86_64
          - os: windows-2022
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Install Linux system deps (GObject/PyGObject for tray)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            libgirepository1.0-dev gir1.2-appindicator3-0.1 \
            libcairo2-dev pkg-config

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Install PyGObject (Linux frozen build)
        if: runner.os == 'Linux'
        # 3.46 is the last release compatible with libgirepository-1.0
        # (Ubuntu 22.04); newer needs girepository-2.0.
        run: pip install "pygobject==3.46.0"

      - name: Generate app icons
        run: python tools/gen_app_icon.py dist

      - name: Build executable (PyInstaller)
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --name SleepyJo \
            $ICON_FLAG \
            --hidden-import pystray._util \
            --hidden-import sleepyjo \
            --hidden-import sleepyjo.app \
            --hidden-import sleepyjo.about \
            --hidden-import sleepyjo.wakelock \
            --hidden-import sleepyjo.battery \
            --hidden-import sleepyjo.icons \
            --hidden-import sleepyjo.tray \
            --hidden-import sleepyjo.i18n \
            sleepyjo/__main__.py
        env:
          ICON_FLAG: ${{ runner.os == 'macOS' && '--icon dist/icon.icns' || (runner.os == 'Windows' && '--icon dist/icon.ico' || '--icon dist/icon.png') }}

      # ---------- macOS: .app bundle -> DMG ----------
      - name: Package DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/SleepyJo.app/Contents/MacOS dist/SleepyJo.app/Contents/Resources dist/dmg
          cp dist/SleepyJo dist/SleepyJo.app/Contents/MacOS/SleepyJo
          cp dist/icon.icns dist/SleepyJo.app/Contents/Resources/AppIcon.icns
          cat > dist/SleepyJo.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>SleepyJo</string>
            <key>CFBundleDisplayName</key><string>SleepyJo</string>
            <key>CFBundleExecutable</key><string>SleepyJo</string>
            <key>CFBundleIdentifier</key><string>com.filmfer.sleepyjo</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleIconName</key><string>AppIcon</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep -s - dist/SleepyJo.app 2>/dev/null || true
          cp -R dist/SleepyJo.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname SleepyJo -srcfolder dist/dmg \
            -ov -format UDZO dist/SleepyJo-${{ matrix.os }}-${{ matrix.arch }}.dmg

      # ---------- Windows: Inno Setup EXE installer ----------
      - name: Package EXE installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          @'
          [Setup]
          AppName=SleepyJo
          AppVersion=0.1.0
          DefaultDirName={autopf}\SleepyJo
          OutputDir=dist
          OutputBaseFilename=SleepyJo-Setup-x64
          Compression=lzma2
          SolidCompression=yes
          [Files]
          Source: "dist\SleepyJo.exe"; DestDir: "{app}"
          [Icons]
          Name: "{autoprograms}\SleepyJo"; Filename: "{app}\SleepyJo.exe"
          Name: "{autodesktop}\SleepyJo"; Filename: "{app}\SleepyJo.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "Create a &desktop shortcut"; GroupDescription: "Additional icons:"
          [Run]
          Filename: "{app}\SleepyJo.exe"; Description: "Launch SleepyJo"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content installer.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      # ---------- Linux: install.sh with embedded binary + icon ----------
      - name: Package install.sh
        if: runner.os == 'Linux'
        run: |
          base64 -w0 dist/SleepyJo > dist/SleepyJo.b64
          base64 -w0 dist/icon.png > dist/icon.b64
          cat > dist/install-sleepyjo.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          PREFIX="${PREFIX:-/usr/local}"
          echo "SleepyJo installer -> $PREFIX"
          sed -n '/^__PAYLOAD_BIN__$/,/^__PAYLOAD_ICON__$/p' "$0" | sed '1d;$d' | base64 -d > /tmp/sleepyjo-bin
          chmod +x /tmp/sleepyjo-bin
          sudo mkdir -p "$PREFIX/bin"
          sudo mv /tmp/sleepyjo-bin "$PREFIX/bin/sleepyjo"
          sudo mkdir -p "$PREFIX/share/icons/hicolor/256x256/apps"
          sed -n '/^__PAYLOAD_ICON__$/,$p' "$0" | sed '1d' | base64 -d > /tmp/sleepyjo-icon.png
          sudo mv /tmp/sleepyjo-icon.png "$PREFIX/share/icons/hicolor/256x256/apps/sleepyjo.png"
          sudo mkdir -p "$PREFIX/share/applications"
          cat > "$PREFIX/share/applications/sleepyjo.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=SleepyJo
          Exec=sleepyjo
          Icon=sleepyjo
          Categories=Utility;
          X-GNOME-UsesNotifications=true
          DESKTOP
          sudo gtk-update-icon-cache /usr/share/icons/hicolor 2>/dev/null || true
          echo "Installed. Run: sleepyjo"
          echo "Requires: PyGObject tray deps (apt install python3-gi gir1.2-appindicator3-0.1)"
          exit 0
          __PAYLOAD_BIN__
          SCRIPT
          cat dist/SleepyJo.b64 >> dist/install-sleepyjo.sh
          echo "__PAYLOAD_ICON__" >> dist/install-sleepyjo.sh
          cat dist/icon.b64 >> dist/install-sleepyjo.sh
          chmod +x dist/install-sleepyjo.sh
          rm dist/SleepyJo.b64 dist/icon.b64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SleepyJo-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/SleepyJo-Setup-*
            dist/install-sleepyjo.sh
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/SleepyJo-Setup-*
            dist/install-sleepyjo.sh
          fail_on_unmatched_files: true
          generate_release_notes: true

