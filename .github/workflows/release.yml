name: Release

on:
  push:
    tags: ['v*']

env:
  # Bump the Python version here (single source of truth).
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS - Apple Silicon (M Series) native
          - os: macos-14
            arch: arm64
          # macOS - Intel
          - os: macos-13
            arch: x86_64
          # Linux (Debian/Ubuntu/Fedora compatible) - x86_64
          - os: ubuntu-22.04
            arch: x86_64
          # Linux - ARM64
          - os: ubuntu-22.04-arm
            arch: aarch64
          # Windows - x64
          - os: windows-2022
            arch: x64
          # Windows - ARM64
          - os: windows-11-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch }}

      - name: Install Linux system deps (GObject/PyGObject for tray)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            libgirepository1.0-dev gir1.2-appindicator3-0.1 \
            libcairo2-dev pkg-config

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --name SleepyJo \
            --hidden-import pystray._util \
            sleepyjo/__main__.py

      - name: Rename artifact per platform
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            mv dist/SleepyJo dist/SleepyJo.app
            tar -czf dist/SleepyJo-${{ matrix.os }}-${{ matrix.arch }}.app.tar.gz -C dist SleepyJo.app
          elif [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/SleepyJo.exe dist/SleepyJo-${{ matrix.os }}-${{ matrix.arch }}.exe
          else
            mv dist/SleepyJo dist/SleepyJo-${{ matrix.os }}-${{ matrix.arch }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SleepyJo-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/SleepyJo-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SleepyJo-*
          generate_release_notes: true
