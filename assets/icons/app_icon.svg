<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo escuro moderno -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Gradiente para o símbolo de Power e Lua -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados (squircle moderno para compatibilidade macOS/cross-platform) -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Lua Crescente em Repouso -->
  <path d="M 320 150 
           A 130 130 0 1 1 210 370 
           A 150 150 0 0 0 320 150 Z" 
        fill="url(#accentGrad)" 
        opacity="0.25"/>

  <!-- Símbolo Power (Círculo aberto) -->
  <path d="M 200 190 
           A 100 100 0 1 0 312 190" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="28" 
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Símbolo Power (Barra vertical central) -->
  <line x1="256" y1="130" x2="256" y2="230" 
        stroke="url(#accentGrad)" 
        stroke-width="28" 
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Indicador 'Zzz' subtil em órbita -->
  <path d="M 345 130 H 375 L 345 160 H 375" 
        fill="none" 
        stroke="#38BDF8" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.85"/>
  <path d="M 385 100 H 405 L 385 120 H 405" 
        fill="none" 
        stroke="#818CF8" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.6"/>
</svg>
